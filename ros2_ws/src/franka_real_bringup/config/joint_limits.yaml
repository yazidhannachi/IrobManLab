# MoveIt time-parameterization limits for the real robot. Velocities are capped
# well below the FR3 hardware limits (2.62 rad/s for joints 1-4, 5.26 rad/s for
# 5 and 7, 4.18 rad/s for 6); accelerations match the simulation. Requests
# without explicit scaling use 10 %. trajectory_guard.py applies the same
# velocity caps to every arm trajectory goal, including direct ones.
default_velocity_scaling_factor: 0.1
default_acceleration_scaling_factor: 0.1
joint_limits:
  fr3_joint1: {has_velocity_limits: true, max_velocity: 1.0, has_acceleration_limits: true, max_acceleration: 3.75}
  fr3_joint2: {has_velocity_limits: true, max_velocity: 1.0, has_acceleration_limits: true, max_acceleration: 1.875}
  fr3_joint3: {has_velocity_limits: true, max_velocity: 1.0, has_acceleration_limits: true, max_acceleration: 2.5}
  fr3_joint4: {has_velocity_limits: true, max_velocity: 1.0, has_acceleration_limits: true, max_acceleration: 3.125}
  fr3_joint5: {has_velocity_limits: true, max_velocity: 1.5, has_acceleration_limits: true, max_acceleration: 3.75}
  fr3_joint6: {has_velocity_limits: true, max_velocity: 1.5, has_acceleration_limits: true, max_acceleration: 5.0}
  fr3_joint7: {has_velocity_limits: true, max_velocity: 1.5, has_acceleration_limits: true, max_acceleration: 5.0}
  fr3_finger_joint1: {has_velocity_limits: true, max_velocity: 0.1, has_acceleration_limits: true, max_acceleration: 1.0}
  fr3_finger_joint2: {has_velocity_limits: true, max_velocity: 0.1, has_acceleration_limits: true, max_acceleration: 1.0}
