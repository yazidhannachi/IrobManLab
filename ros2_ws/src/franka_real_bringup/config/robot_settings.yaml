# Applied by robot_settings.py at every real-robot bringup, before the arm
# controller is activated; the robot accepts them only while not controlled.
robot_settings:
  ros__parameters:
    # Camera and mount on the Franka Hand, computed from the URDF: mass [kg],
    # centre of mass in the flange frame fr3_link8 [m] and inertia about it,
    # column-major [kg m^2]. Desk's end-effector stays the Franka Hand.
    load_mass: 0.2175
    load_center_of_mass: [-0.063, 0.063, 0.0072]
    load_inertia: [0.000232, 0.0000347, -0.0000121, 0.0000347, 0.000232, 0.0000121,
                   -0.0000121, 0.0000121, 0.000408]
    # Collision reflex thresholds as in franka_ros: joint torques [Nm] and
    # Cartesian forces/torques [N, Nm], used for contact and reflex, nominal
    # and during acceleration. Lower values stop the robot on lighter contact.
    collision_torque_thresholds: [20.0, 20.0, 18.0, 18.0, 16.0, 14.0, 12.0]
    collision_force_thresholds: [20.0, 20.0, 20.0, 25.0, 25.0, 25.0]
